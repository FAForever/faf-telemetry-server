micronaut:
  application:
    name: telemetryServer
  router:
    static-resources:
      default:
        enabled: true
        paths: "classpath:public"
        #paths: "file:./src/main/resources/public"
netty:
  default:
    allocator:
      max-order: 3
jackson:
  # Jackson 3 defaults to toString() for enums; the v1 protocol and UI use enum names (e.g. HOST_CANDIDATE)
  enum-features:
    READ_ENUMS_USING_TO_STRING: false
    WRITE_ENUMS_USING_TO_STRING: false
log:
  level:
    com.faforever: INFO
game:
  cache:
    expiration-minutes: ${GAME_CACHE_EXPIRATION_MINUTES:240} # Default: 4 Hours
    max-size: ${GAME_CACHE_MAX_SIZE:10000} # Default: 10_000 Games
